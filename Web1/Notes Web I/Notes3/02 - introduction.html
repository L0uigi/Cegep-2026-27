<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Flex - introduction</title>
    <style>
        section {
            margin-bottom:50px;
            min-height:200px;
            padding:10px;
            border: 1px solid blue;
            /*tous les enfants immédiats sont à côté de l'autre*/
            display: flex;
            /*Peut prendre margin, mais on prends "gap" ^pour flex.*/
            gap: 5px;
            /* pour manipuler l'axe secondaire, par defaut: axe verticale*/
            align-items: stretch;
            align-items: flex-start;
            align-items: flex-end;

            & .child-1 {
                /*changer align-item par défaut*/
                align-self: flex-start;
            }
        }

        div {
            border: 1px solid black;
            padding: 40px;
        }

        .flex-start {
            /*justify-content est sur l'axe principal, par défaut horizontale*/
            justify-content: flex-start;
        }

        .flex-center {
            justify-content: center;
        }

        .flex-end {
            justify-content: flex-end;
        }

        .flex-space-around {
            justify-content: space-around;
        }

        .flex-space-around {
            justify-content: space-between;
        }

        .flex-dir-col {
            /*inverse l'axe principale (horizontale) et secondaire (verticale)*/ 
            flex-direction: column; /* existe column-reverse,...(par défaut row)*/
        }

    </style>
</head>
<body>
    <section class="flex-start">
        <div class="child-1">Enfant 1</div>
        <div class="child-2">Enfant 2</div>
        <div class="child-3">Enfant 3</div>
        <div class="child-4">Enfant 4</div>
    </section>
    <section class="flex-center">
        <div class="child-1">Enfant 1</div>
        <div class="child-2">Enfant 2</div>
        <div class="child-3">Enfant 3</div>
        <div class="child-4">Enfant 4</div>
    </section>
    <section class="flex-end">
        <div class="child-1">Enfant 1</div>
        <div class="child-2">Enfant 2</div>
        <div class="child-3">Enfant 3</div>
        <div class="child-4">Enfant 4</div>
    </section>
    <section class="flex-space-around">
        <div class="child-1">Enfant 1</div>
        <div class="child-2">Enfant 2</div>
        <div class="child-3">Enfant 3</div>
        <div class="child-4">Enfant 4</div>
    </section>
    <section class="flex-space-between">
        <div class="child-1">Enfant 1</div>
        <div class="child-2">Enfant 2</div>
        <div class="child-3">Enfant 3</div>
        <div class="child-4">Enfant 4</div>
    </section>
    <section class="flex-dir-col">
        <div class="child-1">Enfant 1</div>
        <div class="child-2">Enfant 2</div>
        <div class="child-3">Enfant 3</div>
        <div class="child-4">Enfant 4</div>
    </section>
</body>
</html>
