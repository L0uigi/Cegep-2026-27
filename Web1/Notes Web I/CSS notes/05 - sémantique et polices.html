<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sémantique et polices</title>
    <style>
        @font-face {
            /* on y donne le nom Rosehot */
            font-family: Rosehot;
            src: url("fonts/Rosehot.ttf");
        }
        html{
            /* on appelle Rosehot, si non dispo, on mets Verdana */
            font-family: Rosehot, Verdana;
        }

        p{
            /* dépl.hor, dépl. vert.  , épaisseur, couleur */
            box-shadow: 0 2px 2px red;
        }
    </style>
</head>
<body>
    <!-- balises sémentique : div avec un autre nom pour mieux se retrouver -->
    <!-- div avec le nom "header" -->
    <header> 
        <div>
            <h1>Titre de la page</h1>
        </div>
        <!-- div avec le nom "nav" pour menu naviguation (onglets) -->
        <nav>
            <ul>
                <li>Accueil</li>
                <li>À propos</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <!-- div avec le nom "main" -->
    <main>
        <!-- div avec le nom "section" -->
        <section>
            <h2>Nouveau robot disponible!</h2>
            <p>lorem ipsum dolor sit amet.</p>
        </section>
        <section>
            <h2>Nouveau robot disponible!</h2>
            <p>lorem ipsum dolor sit amet.</p>
        </section>
    </main>
    <!-- div avec le nom "footer" -->
    <footer>
        Pied de page ici
    </footer>
</body>
<!-- balise sémentique : article, aside -->
</html>
